name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Not a real database — prisma generate only reads the schema,
      # it never connects, but the client warns if the env var is unset.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Typecheck, lint, build
        run: pnpm exec turbo run typecheck lint build

      - name: Audit production dependencies
        # --prod skips devDependencies (e.g. Vite's dev-server-only CVEs) —
        # those never ship to production, so they'd just be noise here.
        run: pnpm audit --audit-level=high --prod
